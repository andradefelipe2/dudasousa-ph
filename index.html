<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duda Sousa | Fotógrafa de Mulheres e Marcas</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- FontAwesome (Ícones do WhatsApp e Instagram) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Cabeçalho / Perfil -->
  <header class="profile-header">
    <div class="profile-container">
      <div class="avatar-wrapper">
        <img src="https://raw.githubusercontent.com/andradefelipe2/dudasousa-ph/main/logo.jpg" alt="Duda Sousa" class="avatar-img">
      </div>
      <div class="profile-info">
        <h1>Duda Sousa</h1>
        <p class="tagline">Fotógrafa de mulheres e marcas</p>
        <p class="subtext">Fotos • Vídeos • Mentorias</p>
        <p class="location">📍 São Paulo | Atendo MG • SP • RJ</p>
        
        <div class="actions">
          <a href="https://wa.me/553496393196" target="_blank" rel="noopener" class="btn-primary">
            <i class="fa-brands fa-whatsapp"></i> Solicitar Orçamento
          </a>
          <a href="https://www.instagram.com/dudasousa.ph/" target="_blank" rel="noopener" class="btn-secondary">
            <i class="fa-brands fa-instagram"></i> @dudasousa.ph
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <!-- Seção de Destaques / Eventos (Scroll Horizontal) -->
    <section class="events-section">
      <h2 class="section-title">Projetos & Ensaios</h2>
      <div class="events-scroll" id="events-container">
        <!-- Gerado dinamicamente via JS -->
      </div>
    </section>

    <!-- Seção da Galeria de Fotos -->
    <section class="gallery-section">
      <div class="gallery-header">
        <h3 id="current-event-title">Selecione um projeto</h3>
      </div>
      <div class="gallery-grid" id="gallery-container">
        <!-- Fotos do Google Drive inseridas via JS -->
      </div>
      <div class="loading-spinner" id="loading-spinner">
        <div class="spinner"></div>
        <p>Carregando fotografias...</p>
      </div>
    </section>
  </main>

  <!-- Botão Flutuante do WhatsApp -->
  <a href="https://wa.me/553496393196" class="whatsapp-float" target="_blank" rel="noopener" aria-label="Falar pelo WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <!-- Modal / Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img class="lightbox-img" id="lightbox-img" src="" alt="Ampliação da foto">
  </div>

  <footer>
    <p>&copy; Duda Sousa Fotografia. Todos os direitos reservados.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
