<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duda Sousa | Fotógrafa de Mulheres e Marcas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

<!-- Cabeçalho / Perfil -->
<header class="profile-header">
  <div class="profile-container">
    <div class="avatar-wrapper">
      <!-- Foto de perfil oficial da Duda vinda do GitHub -->
      <img src="https://raw.githubusercontent.com/andradefelipe2/dudasousa-ph/main/logo.jpg" alt="Duda Sousa" class="avatar-img">
    </div>
    <div class="profile-info">
      <h1>Duda Sousa</h1>
      <p class="tagline">Fotógrafa de mulheres e marcas</p>
      <p class="subtext">Fotos • Vídeos • Mentorias</p>
      <p class="location">📍 São Paulo | Atendo MG • SP • RJ</p>
      <div class="actions">
        <a href="https://link.me/dudasousa" target="_blank" rel="noopener" class="btn-primary">Solicitar Orçamento</a>
      </div>
    </div>
  </div>
</header>

  <main class="main-content">
    <!-- Seção de Destaques / Eventos (Scroll Horizontal) -->
    <section class="events-section">
      <h2 class="section-title">Projetos & Ensaios</h2>
      <div class="events-scroll" id="events-container">
        <!-- Gerado dinamicamente via JS -->
      </div>
    </section>

    <!-- Seção da Galeria de Fotos -->
    <section class="gallery-section">
      <div class="gallery-header">
        <h3 id="current-event-title">Selecione um projeto</h3>
      </div>
      <div class="gallery-grid" id="gallery-container">
        <!-- Fotos do Google Drive inseridas via JS -->
      </div>
      <div class="loading-spinner" id="loading-spinner">
        <div class="spinner"></div>
        <p>Carregando fotografias...</p>
      </div>
    </section>
  </main>

  <!-- Modal / Lightbox para ampliação da imagem -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img class="lightbox-img" id="lightbox-img" src="" alt="Ampliação da foto">
  </div>

  <footer>
    <p>&copy; Duda Sousa Fotografia. Todos os direitos reservados.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
